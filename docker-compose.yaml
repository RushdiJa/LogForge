services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://logforge:logforge@postgres:5432/logforge"

    depends_on:
      postgres:
        condition: service_healthy

    cpus: 0.5
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: logforge
      POSTGRES_PASSWORD: logforge
      POSTGRES_DB: logforge

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logforge -d logforge"]
      interval: 5s
      timeout: 3s
      retries: 10

    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=30min
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - bgwriter_lru_maxpages=500
      - -c
      - bgwriter_lru_multiplier=3.0
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_connections=30
      - -c
      - jit=off

    cpus: 1.0
    mem_limit: 1g

volumes:
  postgres_data: