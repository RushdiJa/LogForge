services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://logforge:logforge@postgres:5432/logforge
      RABBITMQ_URL: amqp://logforge:logforge@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      CACHE_TTL_MS: "${CACHE_TTL_MS:-5000}"
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-warn}"
      QUEUE_FLUSH_INTERVAL_MS: "${QUEUE_FLUSH_INTERVAL_MS:-100}"
      QUEUE_MAX_BATCH_LOGS: "${QUEUE_MAX_BATCH_LOGS:-5000}"
      QUEUE_WRITE_CONCURRENCY: "${QUEUE_WRITE_CONCURRENCY:-1}"
      QUEUE_METRICS_INTERVAL_MS: "${QUEUE_METRICS_INTERVAL_MS:-0}"
      QUEUE_CONSUMER_ENABLED: "${QUEUE_CONSUMER_ENABLED:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-alpine
    hostname: logforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: logforge
      RABBITMQ_DEFAULT_PASS: logforge
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +A 8 +sbwt none +sbwtdcpu none +sbwtdio none"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 896mb
      - --maxmemory-policy
      - allkeys-lfu
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logforge
      POSTGRES_USER: logforge
      POSTGRES_PASSWORD: logforge
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=256MB
      - -c
      - autovacuum_naptime=20s
    cpus: 1.0
    mem_limit: 1g
    shm_size: 256m
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logforge -d logforge"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
