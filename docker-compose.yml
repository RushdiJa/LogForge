services:
  app:
    build: .
    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: postgresql://logforge:logforge@postgres:5432/logforge

    depends_on:
      postgres:
        condition: service_healthy

    cpus: 0.5
    mem_limit: 256m

  postgres:
    image: postgres:18-alpine

    environment:
      POSTGRES_USER: logforge
      POSTGRES_PASSWORD: logforge
      POSTGRES_DB: logforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logforge -d logforge"]
      interval: 2s
      timeout: 2s
      retries: 10

    cpus: 1.0
    mem_limit: 1g

volumes:
  postgres_data: